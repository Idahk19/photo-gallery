{% extends 'base.html' %}

{% block title %}Edit Profile | Photo Gallery{% endblock %}

{% block content %}

<div class="min-h-screen bg-gray-100 py-12 px-6">

    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-8">

        <h1 class="text-3xl font-bold text-center mb-8">
            Edit Profile
        </h1>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-6">
    <label class="block text-sm font-medium text-gray-700 mb-2">
        Username
    </label>

    <input
        type="text"
        name="username"
        value="{{ user.username }}"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
    >
</div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ user.email }}"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                >
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Bio
                </label>

                <textarea
                    name="bio"
                    rows="5"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                >{{ profile.bio }}</textarea>
            </div>

            <div class="flex justify-between items-center">

                <a
                    href="{% url 'profile' %}"
                    class="text-gray-600 hover:text-purple-600"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg font-semibold"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
