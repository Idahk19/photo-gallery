<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Photo Gallery{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">

    <nav class="bg-gray-900 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4">

            <div class="flex items-center justify-between">

                <a href="{% url 'home' %}"
                   class="text-2xl font-bold tracking-wide">
                    Photo<span class="text-purple-400">Gallery</span>
                </a>

                <div class="flex items-center gap-6">

                    <a href="{% url 'home' %}"
                       class="hover:text-purple-400 transition">
                        Home
                    </a>

                    {% if user.is_authenticated %}
                        <a href="{% url 'upload_photo' %}"
       class="px-4 py-2 bg-blue-600 text-white rounded-lg">
        Upload Photo
    </a>

                        <a href="{% url 'profile' %}" class="hover:text-purple-400 transition">
                            Profile
                        </a>

                        <form method="POST" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit"
                                    class="hover:text-purple-400 transition">
                                Logout
                            </button>
                        </form>

                    {% else %}

                        <a href="{% url 'login' %}"
                           class="hover:text-purple-400 transition">
                            Login
                        </a>

                        <a href="{% url 'register' %}"
                           class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg transition">
                            Register
                        </a>

                    {% endif %}

                </div>

            </div>

        </div>
    </nav>

    <main>
    {% block content %}
    {% endblock %}

</main>
    <footer class="bg-gray-900 text-gray-400 mt-20">

        <div class="max-w-7xl mx-auto px-6 py-8">

            <div class="text-center">

                <p class="text-lg font-semibold text-white">
                    PhotoGallery
                </p>

                <p class="mt-2">
                    Discover. Explore. Appreciate.
                </p>

                <p class="mt-4 text-sm">
                    &copy; 2026 PhotoGallery. All rights reserved.
                </p>

            </div>

        </div>

    </footer>

</body>
</html>
